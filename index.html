<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Color Crash Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<div id="titleScreen" class="screen">
  <h1 class="titleMain">COLOR CRASH<br>BATTLE</h1>

  <div id="menuButtons" class="menu-panel">
    <button id="btnCpu" class="menu-btn">CPUと対戦</button>
    <button id="btnShowCreate" class="menu-btn">ルームを作る</button>
    <button id="btnShowJoin" class="menu-btn">ルームに参加</button>
    <button id="btnShowTech" class="menu-btn small">技一覧</button>
  </div>

  <div id="createPanel" class="menu-panel hidden">
    <p class="panel-desc">このコードを相手に伝えてください</p>
    <div id="roomCodeDisplay" class="room-code">------</div>
    <button id="btnCopyCode" class="menu-btn small">コードをコピー</button>
    <p id="createStatus" class="panel-status"></p>
    <button id="btnCancelCreate" class="menu-btn ghost">戻る</button>
  </div>

  <div id="joinPanel" class="menu-panel hidden">
    <p class="panel-desc">相手のコードを入力してください</p>
    <input id="joinCodeInput" class="room-input" maxlength="6" placeholder="ABCDEF" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="btnJoinConfirm" class="menu-btn">参加する</button>
    <p id="joinStatus" class="panel-status"></p>
    <button id="btnCancelJoin" class="menu-btn ghost">戻る</button>
  </div>

  <div id="techPanel" class="menu-panel hidden">
    <p class="panel-desc">技一覧(5マス以上のつながりで発動。4マス消しは技名なし)</p>
    <div id="techList" class="tech-list"></div>
    <button id="btnCloseTech" class="menu-btn ghost">戻る</button>
  </div>
</div>

<div id="app" class="screen hidden">
  <div class="appHeader">
    <button id="leaveBtn" class="leave-btn">✕ 退出</button>
    <h1 class="title">COLOR CRASH BATTLE</h1>
  </div>
  <div id="oppPanel">
    <div id="oppHpWrap" class="hpwrap"><div class="hplabel">敵</div><div class="hpbar"><div id="oppHpFill" class="hpfill"></div></div><div id="oppHpNum" class="hpnum">100</div></div>
    <div id="oppBoard" class="board"></div>
  </div>

  <div id="selfHpWrap" class="hpwrap">
    <div class="hplabel">YOU</div>
    <div class="hpbar"><div id="selfHpFill" class="hpfill"></div></div>
    <div id="selfHpNum" class="hpnum">100</div>
  </div>
  <div id="selfBoard" class="board"></div>
  <div id="tray"></div>

  <div id="skillPopup">
    <div id="skillLines"></div>
    <div id="skillDamage"></div>
    <div id="skillHeal"></div>
  </div>
  <div id="overlay">
    <div class="overlay-card">
      <div id="overlayTitle"></div>
      <p id="rematchStatus" class="panel-status"></p>
      <div class="overlay-actions">
        <button id="restartBtn">もう一度</button>
        <button id="leaveMatchBtn" class="menu-btn ghost hidden">タイトルへ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script src="js/shapes.js?v=4"></script>
<script src="js/board.js?v=4"></script>
<script src="js/state.js?v=4"></script>
<script src="js/net.js?v=4"></script>
<script src="js/render.js?v=4"></script>
<script src="js/input.js?v=4"></script>
<script src="js/title.js?v=4"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
